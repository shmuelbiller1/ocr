name: Windows desktop build

on:
  push:
    branches: [main]
    # A tag that starts with "v" is a release: the build makes the
    # program for Windows and publishes it.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The runner has no screen, so Qt works without one.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          # The head of the pull request and not the merge that the
          # runner makes: the build writes the measured accuracy into
          # the documentation of the branch, and the merge commit must
          # never be pushed into the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Qt needs these system libraries to start its offscreen platform.
      # They come from the Ubuntu archive (main) and are only used by the
      # test job, never by the shipped application.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Unit tests failed::the test suite did not pass"
            tail -n 40 test-output.txt | while IFS= read -r line; do
              echo "::error title=Unit tests::${line}"
            done
            exit 1
          fi
      - name: Run the self-test without a display
        run: |
          python app.py --selftest --selftest-report selftest-linux.json || {
            echo "::error title=Self-test failed::the self-test did not pass"
            cat selftest-linux.json | while IFS= read -r line; do
              echo "::error title=Self-test::${line}"
            done
            exit 1
          }
      - name: Show the self-test report
        if: always()
        run: cat selftest-linux.json
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        run: python tools/publish_diagnostics.py --branch=ci/diagnostics-linux selftest-linux.json test-output.txt
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report-linux
          path: selftest-linux.json
          if-no-files-found: warn

  test-and-package:
    name: Windows executable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The head of the pull request and not the merge that the
          # runner makes: the build writes the measured accuracy into
          # the documentation of the branch, and the merge commit must
          # never be pushed into the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the test suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 |
            Tee-Object -FilePath test-output.txt
          if ($LASTEXITCODE -ne 0) { throw 'the test suite did not pass' }
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --add-data "samples;samples" `
            --add-data "LICENSE;." `
            --name HebrewNotesWorkbench app.py 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) { throw 'the application could not be built' }
      - name: Install the recognition engine
        shell: pwsh
        run: |
          # The worker of the recognition is given to the user with the
          # program, so that the program can read handwriting without
          # anything else.  torch and torchvision have to be a matching
          # pair from the same place.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" "torchvision==0.29.0" 2>&1 | Out-File -Encoding utf8 install-engine.log
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "kraken==7.1.1" "pillow==11.3.0" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          # The page segmentation of the second engine (Mishkefet) is
          # written with OpenCV.  The package is Apache-2.0 and it does
          # not need a display.
          python -m pip install "opencv-python-headless==4.12.0.88" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          python tools/check_engine.py 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          if ($LASTEXITCODE -ne 0) { throw 'torch and torchvision do not belong together' }
      - name: Build the recognition worker
        shell: pwsh
        run: |
          python tools/build_worker.py --profile inference --report worker-build.json 2>&1 | Tee-Object -FilePath build-worker.log
          if ($LASTEXITCODE -ne 0) { throw 'the recognition worker could not be built' }
      - name: Verify the executable exists
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\HebrewNotesWorkbench\HebrewNotesWorkbench.exe')) {
            Write-Output '::error title=Packaging::the executable was not produced'
            throw 'Missing exe'
          }
          $size = (Get-Item 'dist\HebrewNotesWorkbench\HebrewNotesWorkbench.exe').Length
          Write-Host "exe size: $size bytes"
      - name: Start the packaged executable (self-test)
        shell: pwsh
        run: |
          # An absolute path: the packaged program starts in the folder it
          # was unpacked into, so a relative path would be written there.
          $report = Join-Path (Get-Location).Path 'selftest-windows.json'
          if (Test-Path $report) { Remove-Item $report }
          pwsh -File tools/run_windows_exe.ps1 `
            -Exe 'dist\HebrewNotesWorkbench\HebrewNotesWorkbench.exe' `
            -Report $report `
            -StdOut 'selftest-out.txt' `
            -StdErr 'selftest-err.txt'
          if (-not (Test-Path $report)) {
            Write-Output "::error title=Self-test::no report was written"
            throw 'The packaged executable did not write its report'
          }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          $data.results | ForEach-Object {
            $line = "$($_.name) ok=$($_.ok) $($_.detail)"
            if ($_.ok) { Write-Host $line } else { Write-Output "::error title=Self-test::$line" }
          }
          if (-not $data.ok) {
            throw 'The self-test reported failures'
          }
      - name: Build a console executable for diagnostics
        if: failure()
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console `
            --name HebrewNotesWorkbench-console app.py 2>&1 | Tee-Object -FilePath build-console.log
      - name: Show what the console build reports
        if: failure()
        shell: pwsh
        run: |
          pwsh -File tools/run_windows_exe.ps1 `
            -Exe 'dist\HebrewNotesWorkbench-console.exe' `
            -Report 'selftest-console.json' `
            -StdOut 'console-out.txt' `
            -StdErr 'console-err.txt'
      - name: Put the program into a folder for the user
        shell: pwsh
        run: |
          python tools/build_release.py --app dist/HebrewNotesWorkbench --worker dist/ocr-worker --download-licences 2>&1 | Tee-Object -FilePath build-release.log
          if ($LASTEXITCODE -ne 0) { throw 'the release was not made' }
      - name: Download the recognition model
        shell: pwsh
        run: |
          python tools/download_model.py --model kraken-ppocrv6-small --target .cache/models 2>&1 | Out-File -Encoding utf8 model-download.log
          if ($LASTEXITCODE -ne 0) { throw 'the model could not be downloaded' }
          foreach ($model in @('kraken-ppocrv6-medium', 'mishkefet-v1', 'mishkefet-char-lm', 'mishkefet-word-lm')) {
            python tools/download_model.py --model $model --target .cache/models
            if ($LASTEXITCODE -ne 0) { throw "model setup failed: $model" }
          }
      - name: Check the release as a user gets it
        shell: pwsh
        run: |
          # The archive is unpacked as a user unpacks it, and the
          # program and the worker are started from the unpacked
          # folder, so that the build says whether the archive holds
          # everything that is needed to read a page.
          $folder = Join-Path $env:RUNNER_TEMP 'release-check'
          if (Test-Path $folder) { Remove-Item -Recurse -Force $folder }
          New-Item -ItemType Directory -Path $folder | Out-Null
          $archive = (Get-ChildItem 'release' -Filter '*.zip' | Select-Object -First 1)
          if (-not $archive) { throw 'the archive for the user was not made' }
          Expand-Archive -Path $archive.FullName -DestinationPath $folder
          Get-ChildItem $folder -Recurse -File |
            ForEach-Object { "$($_.FullName) $($_.Length)" } |
            Out-File -Encoding utf8 'release-listing.txt'
          $program = Get-ChildItem $folder -Recurse -Filter 'HebrewNotesWorkbench.exe' | Select-Object -First 1
          if (-not $program) { throw 'the program is not in the archive' }
          $worker = Get-ChildItem $folder -Recurse -Filter 'ocr-worker.exe' | Select-Object -First 1
          if (-not $worker) { throw 'the worker of the recognition is not in the archive' }
          # The program starts from the unpacked folder.
          pwsh -File tools/run_windows_exe.ps1 `
            -Exe $program.FullName `
            -Report (Join-Path $folder 'selftest.json') `
            -StdOut 'release-selftest-out.txt' `
            -StdErr 'release-selftest-err.txt'
          if (-not (Test-Path (Join-Path $folder 'selftest.json'))) {
            Write-Output '::error title=Release::the unpacked program did not write its report'
            throw 'the unpacked program did not start'
          }
          python tools/verify_worker_bundle.py `
            --worker $worker.FullName --models .cache/models `
            --pdf benchmark/smoke_test/pages/scan-2026-10-28-221624.pdf `
            --image samples/scan_page_1.png --report release-offline-check.json
          if ($LASTEXITCODE -ne 0) { throw 'the unpacked offline worker checks failed' }
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName) $($_.Length)" } | Out-File -Encoding utf8 'dist-listing.txt'
          python tools/publish_diagnostics.py --branch=ci/diagnostics test-output.txt build-windows.log build-worker.log install-engine.log build-console.log build-release.log selftest-windows.json selftest-out.txt selftest-out.txt.exit.txt selftest-err.txt selftest-console.json console-out.txt console-out.txt.exit.txt console-err.txt dist-listing.txt model-download.log release-listing.txt release-selftest-out.txt release-selftest-err.txt release-worker-out.txt release-worker-err.txt release-result.json worker-build.json release-offline-check.json
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report-windows
          path: selftest-windows.json
          if-no-files-found: warn
      - name: Upload the Windows application
        uses: actions/upload-artifact@v4
        with:
          name: HebrewNotesWorkbench-Windows
          path: dist/HebrewNotesWorkbench
          if-no-files-found: error
      - name: Upload the archive for the user
        uses: actions/upload-artifact@v4
        with:
          name: HebrewNotesWorkbench-release
          path: release
          if-no-files-found: error

  ocr-engine:
    name: Recognition engine and accuracy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The head of the pull request and not the merge that the
          # runner makes: the build writes the measured accuracy into
          # the documentation of the branch, and the merge commit must
          # never be pushed into the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore the cache of the engine
        uses: actions/cache@v4
        with:
          path: |
            .cache/models
            .cache/pinkas
          key: engine-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: engine-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recognition engine
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            # torch and torchvision have to be a matching pair, and both
            # have to come from the same place.  kraken asks for
            # torch<=2.14, and the torchvision that belongs to torch
            # 2.14.1 asks for torch 2.14.1, so pip leaves the two
            # apart and the recognition dies with "operator
            # torchvision::nms does not exist".  The pair is pinned.
            python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" "torchvision==0.29.0"
            python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "kraken==7.1.1" "pillow==11.3.0"
            # The page segmentation of the second engine (Mishkefet) is
            # written with OpenCV.  The package is Apache-2.0 and it does
            # not need a display.
            python -m pip install "opencv-python-headless==4.12.0.88"
            # The pages of a PDF are read with pypdfium2, and the real
            # page of the smoke test is a PDF.
            python -m pip install "pypdfium2==4.30.0"
          } 2>&1 | tee install-engine.log
      - name: Check that torch and torchvision belong together
        run: |
          set -o pipefail
          python tools/check_engine.py 2>&1 | tee check-engine.log
      - name: Download and check the recognition models
        run: |
          set -o pipefail
          python tools/download_model.py --model kraken-ppocrv6-small --target .cache/models 2>&1 | tee model-download.log
          if [ "$?" -ne 0 ]; then throw 'the model could not be downloaded'; fi
          # The second model of the same family, so that the engines can
          # be compared with one another on the same pages.
          python tools/download_model.py --model kraken-ppocrv6-medium --target .cache/models 2>&1 | tee model-download-medium.log
          if [ "$?" -ne 0 ]; then throw 'the second model could not be downloaded'; fi
          # The model of the second engine, which was written for modern
          # Hebrew cursive.  Its licence is not a commercial one, and the
          # file is checked against the digest that the project pinned.
          python tools/download_model.py --model mishkefet-v1 --target .cache/models 2>&1 | tee model-download-mishkefet.log
          if [ "$?" -ne 0 ]; then throw 'the model of the second engine could not be downloaded'; fi
      - name: Check the corpus of the modern school handwriting
        run: |
          set -o pipefail
          # The manifest that is in the repository is the one that says
          # which pages are measured every time.  The build writes its
          # own manifest to another place, and the measurement is
          # checked against the manifest of the repository: a page that
          # was replaced without the manifest being written again stops
          # the build.
          python tools/build_benchmark.py \
            --corpus benchmark/modern_school \
            --output build/manifest-of-the-build.json \
            2>&1 | tee benchmark-corpus.log
      - name: Measure the accuracy on the modern school handwriting
        run: |
          set -o pipefail
          # The material the program is made for.  The corpus has no
          # verified page yet, so the report says that the accuracy on
          # this material is not verified - and that is the truth.
          python tools/benchmark_ocr.py \
            --corpus benchmark/modern_school \
            --models .cache/models \
            --engines kraken-ppocrv6-small kraken-ppocrv6-medium mishkefet-v1 \
            --output ocr-accuracy-modern.json 2>&1 | tee benchmark-modern.log
          if [ "$?" -ne 0 ]; then throw 'the measurement of the modern corpus failed'; fi
      - name: Measure the accuracy on the diagnostic corpus of the old handwriting
        run: |
          set -o pipefail
          # Every engine is measured on the same pages, so that they can
          # be compared with one another.  The models are the ones that
          # were downloaded above, and not the ones of the program.
          python tools/benchmark_ocr.py \
            --pinkas --download --cache .cache/pinkas --pages 5 \
            --models .cache/models \
            --engines kraken-ppocrv6-small kraken-ppocrv6-medium mishkefet-v1 \
            --output ocr-accuracy.json 2>&1 | tee benchmark.log
          if [ "$?" -ne 0 ]; then throw 'the measurement failed'; fi
      - name: Look at the corpus
        if: always()
        continue-on-error: true
        run: |
          python tools/inspect_dataset.py --cache .cache/pinkas 2>&1 | tee corpus-structure.log || true
      - name: Read a real page of modern handwriting
        run: |
          set -o pipefail
          # A real scan of contemporary handwritten Hebrew.  The page has
          # no transcript that somebody else checked, so nothing is
          # measured here: the readings of every engine are published, so
          # that they can be compared on the same real material.
          python tools/smoke_test.py --require-text \
            --document benchmark/smoke_test/pages/scan-2026-10-28-221624.pdf \
            --models .cache/models \
            --engines kraken-ppocrv6-small kraken-ppocrv6-medium mishkefet-v1 \
            --output build/smoke 2>&1 | tee smoke-test.log
          if [ "$?" -ne 0 ]; then throw 'the reading of the real page failed'; fi
      - name: Compare optional assisted decoding on the supplied scan
        run: |
          set -o pipefail
          python tools/download_model.py --model mishkefet-char-lm --target .cache/models
          python tools/download_model.py --model mishkefet-word-lm --target .cache/models
          python tools/compare_mishkefet.py \
            --document benchmark/smoke_test/pages/scan-2026-10-28-221624.pdf \
            --model .cache/models/mishkefet-v1.pt \
            --output build/decoding-comparison 2>&1 | tee decoding-comparison.log
      - name: Publish decoding comparison (not raw benchmark scores)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mishkefet-decoding-comparison
          path: build/decoding-comparison
          if-no-files-found: warn
      - name: Publish the readings of the real page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-readings
          path: build/smoke
          if-no-files-found: warn
      - name: Write the results into the documentation
        if: always()
        continue-on-error: true
        run: |
          if [ -f ocr-accuracy-modern.json ]; then
            python tools/write_accuracy_results.py --report ocr-accuracy-modern.json --document docs/OCR_ACCURACY.md
          fi
          if [ -f ocr-accuracy.json ]; then
            python tools/write_accuracy_results.py --report ocr-accuracy.json --document docs/OCR_ACCURACY.md --begin '<!-- DIAGNOSTIC:BEGIN -->' --end '<!-- DIAGNOSTIC:END -->'
          fi
      - name: Upload the documentation with the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-accuracy-document
          path: docs/OCR_ACCURACY.md
          if-no-files-found: warn
      - name: Publish the accuracy report
        if: always()
        run: |
          if [ -f ocr-accuracy-modern.json ]; then
            cat ocr-accuracy-modern.json
            python tools/accuracy_notice.py --report ocr-accuracy-modern.json
          fi
          if [ -f ocr-accuracy.json ]; then
            cat ocr-accuracy.json
            python tools/accuracy_notice.py --report ocr-accuracy.json
          fi
      - name: Upload the accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-accuracy-report
          path: ocr-accuracy.json
          if-no-files-found: warn
      - name: Upload the report of the modern school handwriting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-accuracy-modern-report
          path: ocr-accuracy-modern.json
          if-no-files-found: warn
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        run: python tools/publish_diagnostics.py --branch=ci/diagnostics-engine install-engine.log check-engine.log model-download.log model-download-medium.log benchmark-corpus.log benchmark-modern.log benchmark.log corpus-structure.log ocr-accuracy.json ocr-accuracy-modern.json smoke-test.log build/smoke/smoke-small.txt build/smoke/smoke-medium.txt build/smoke/smoke-mishkefet-v1.txt build/smoke/smoke-test.json decoding-comparison.log build/decoding-comparison/decoding-comparison.json build/decoding-comparison/decoding-raw.txt build/decoding-comparison/decoding-comparison-raw.txt build/decoding-comparison/decoding-assisted.txt

  ocr-worker-windows:
    name: OCR worker (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The head of the pull request and not the merge that the
          # runner makes: the build writes the measured accuracy into
          # the documentation of the branch, and the merge commit must
          # never be pushed into the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recognition engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip 2>&1 | Out-File -Encoding utf8 install-engine.log
          # torch and torchvision must be a matching pair from the same
          # place, otherwise the recognition fails to start.  kraken asks
          # for torch<=2.14, and the torchvision that belongs to torch
          # 2.14.1 asks for torch 2.14.1, so pip leaves the two apart
          # and the worker dies with "operator torchvision::nms does not
          # exist".  The pair is pinned.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" "torchvision==0.29.0" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "kraken==7.1.1" "pillow==11.3.0" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          # The page segmentation of the second engine (Mishkefet) is
          # written with OpenCV.  The package is Apache-2.0 and it does
          # not need a display.
          python -m pip install "opencv-python-headless==4.12.0.88" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          # Match the desktop PDF runtime: the independent worker now tests PDFs too.
          python -m pip install "pypdfium2==4.30.0" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          python -m pip install "pyinstaller==6.16.0" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
      - name: Check that torch and torchvision belong together
        shell: pwsh
        run: |
          python tools/check_engine.py 2>&1 | Out-File -Encoding utf8 check-engine.log
          if ($LASTEXITCODE -ne 0) { throw 'torch and torchvision do not belong together' }
      - name: Download and check the recognition model
        shell: pwsh
        run: |
          python tools/download_model.py --model kraken-ppocrv6-small --target .cache/models 2>&1 | Out-File -Encoding utf8 model-download.log
          if ($LASTEXITCODE -ne 0) { throw 'the model could not be downloaded' }
          python tools/download_model.py --model kraken-ppocrv6-medium --target .cache/models
          if ($LASTEXITCODE -ne 0) { throw 'medium model unavailable' }
          python tools/download_model.py --model mishkefet-v1 --target .cache/models 2>&1 | Out-File -Encoding utf8 model-download-mishkefet.log
          if ($LASTEXITCODE -ne 0) { throw 'the model of the second engine could not be downloaded' }
      - name: Install optional decoding files for packaged-worker verification
        shell: pwsh
        run: |
          python tools/download_model.py --model mishkefet-char-lm --target .cache/models
          if ($LASTEXITCODE -ne 0) { throw 'character LM unavailable' }
          python tools/download_model.py --model mishkefet-word-lm --target .cache/models
          if ($LASTEXITCODE -ne 0) { throw 'word LM unavailable' }
      - name: Build the previous worker as the comparison baseline
        shell: pwsh
        run: |
          python tools/build_worker.py --profile baseline --distpath build/baseline-dist --workpath build/baseline-work --report baseline-build.json 2>&1 | Tee-Object -FilePath build-baseline.log
          if ($LASTEXITCODE -ne 0) { throw 'the baseline worker could not be built' }
      - name: Build the OCR worker
        shell: pwsh
        run: |
          python tools/build_worker.py --profile inference --report worker-build.json 2>&1 | Tee-Object -FilePath build-worker.log
          if ($LASTEXITCODE -ne 0) { throw 'the worker could not be built' }
      - name: Compare baseline and inference bundles offline on all models
        shell: pwsh
        run: |
          python tools/verify_worker_bundle.py `
            --baseline build/baseline-dist/ocr-worker/ocr-worker.exe `
            --worker dist/ocr-worker/ocr-worker.exe --models .cache/models `
            --pdf benchmark/smoke_test/pages/scan-2026-10-28-221624.pdf `
            --image samples/scan_page_1.png --report package-comparison.json
          if ($LASTEXITCODE -ne 0) { throw 'the slim worker differs, needs network, or failed' }
      - name: Upload the package audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-packaging-audit
          path: |
            package-comparison.json
            worker-build.json
            baseline-build.json
          if-no-files-found: warn
      - name: Upload the OCR worker
        uses: actions/upload-artifact@v4
        with:
          name: ocr-worker-Windows
          path: dist/ocr-worker
          if-no-files-found: error
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        run: python tools/publish_diagnostics.py --branch=ci/diagnostics-worker install-engine.log check-engine.log model-download.log build-worker.log worker-out.txt worker-err.txt result.json result-mishkefet.json worker-build.json baseline-build.json build-baseline.log package-comparison.json

  release:
    name: Publish the release
    # The release is made of the program that the Windows job built and
    # checked, and not of anything else: the archive of the user is the
    # one that was unpacked and started.
    needs: [test-and-package, unit-tests, ocr-engine, ocr-worker-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Take the archive that was built and checked
        uses: actions/download-artifact@v4
        with:
          name: HebrewNotesWorkbench-release
          path: release
      - name: Write the notes of the release
        env:
          TAG: ${{ github.ref_name }}
          # The notes of the release are written by the tool of GitHub,
          # and it needs the token to ask for them.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          cp docs/RELEASE_NOTES.md release-notes.md
          {
            echo ""
            echo "## The changes of this version"
            echo ""
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
              --jq .body || echo ""
          } >> release-notes.md
      - name: Publish the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          cd release
          # One digest file for every archive, with the name of the
          # archive inside it.
          for archive in ./*.zip; do
            name="$(basename "$archive")"
            sha256sum "$name" > "${name}.sha256"
          done
          # A release with this tag may already be there: the tag may
          # have been pushed before the build had made the archive.  The
          # release is then written again - with the archive, with the
          # digest and with the notes - and the build does not stop.
          existing="$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            # The file is put there under a temporary name first, and
            # the file that was published before is taken away only
            # when the new one is there.  `gh release upload --clobber`
            # deletes the old file before it puts the new one, and a
            # failure in between leaves the user with nothing.
            publish() {
              file="$1"
              name="$(basename "$file")"
              temporary="${name}.new"
              cp "$file" "$temporary"
              # The temporary name is not the name of the file of the
              # user, and it may be replaced without any harm.
              gh release upload "$TAG" "$temporary" --clobber
              old="$(gh api "repos/${{ github.repository }}/releases/$existing/assets" \
                --paginate --jq ".[] | select(.name == \"$name\") | .id" | head -n 1)"
              if [ -n "$old" ]; then
                gh api "repos/${{ github.repository }}/releases/assets/$old" -X DELETE
              fi
              new="$(gh api "repos/${{ github.repository }}/releases/$existing/assets" \
                --paginate --jq ".[] | select(.name == \"$temporary\") | .id" | head -n 1)"
              gh api "repos/${{ github.repository }}/releases/assets/$new" -X PATCH \
                -F name="$name"
            }
            publish ./*.sha256
            publish ./*.zip
            # The notes are written at the end, when the files of the
            # release are there.
            # -F draft=false: the release API wants a boolean and not
            # a text, and it refuses a text with an error.
            gh api "repos/${{ github.repository }}/releases/$existing" -X PATCH \
              -f tag_name="$TAG" \
              -f name="Hebrew Notes Workbench $TAG" \
              -F draft=false \
              -F body=@../release-notes.md
          else
            # --verify-tag: the release is made for the tag that was
            # pushed, and not for a new tag that the tool would make.
            gh release create "$TAG" \
              ./*.zip ./*.sha256 \
              --verify-tag \
              --title "Hebrew Notes Workbench $TAG" \
              --notes-file ../release-notes.md
          fi
