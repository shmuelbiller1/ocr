name: Windows desktop build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run engine-contract tests
        run: python -m unittest discover -s tests -v
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HebrewNotesWorkbench app.py
      - name: Verify generated executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/HebrewNotesWorkbench.exe')) { throw 'Missing exe' }
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HebrewNotesWorkbench-Windows
          path: dist/HebrewNotesWorkbench.exe
          if-no-files-found: error
