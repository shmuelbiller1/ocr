name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The runner has no screen, so Qt works without one.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Qt needs these system libraries to start its offscreen platform.
      # They come from the Ubuntu archive (main) and are only used by the
      # test job, never by the shipped application.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Unit tests failed::the test suite did not pass"
            tail -n 40 test-output.txt | while IFS= read -r line; do
              echo "::error title=Unit tests::${line}"
            done
            exit 1
          fi
      - name: Run the self-test without a display
        run: |
          python app.py --selftest --selftest-report selftest-linux.json || {
            echo "::error title=Self-test failed::the self-test did not pass"
            cat selftest-linux.json | while IFS= read -r line; do
              echo "::error title=Self-test::${line}"
            done
            exit 1
          }
      - name: Show the self-test report
        if: always()
        run: cat selftest-linux.json
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        run: python tools/publish_diagnostics.py --branch=ci/diagnostics-linux selftest-linux.json test-output.txt
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report-linux
          path: selftest-linux.json
          if-no-files-found: warn

  test-and-package:
    name: Windows executable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the test suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 |
            Tee-Object -FilePath test-output.txt
          if ($LASTEXITCODE -ne 0) { throw 'the test suite did not pass' }
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --add-data "samples;samples" `
            --name HebrewNotesWorkbench app.py 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) { throw 'the application could not be built' }
      - name: Verify the executable exists
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\HebrewNotesWorkbench\HebrewNotesWorkbench.exe')) {
            Write-Output '::error title=Packaging::the executable was not produced'
            throw 'Missing exe'
          }
          $size = (Get-Item 'dist\HebrewNotesWorkbench\HebrewNotesWorkbench.exe').Length
          Write-Host "exe size: $size bytes"
      - name: Start the packaged executable (self-test)
        shell: pwsh
        run: |
          # An absolute path: the packaged program starts in the folder it
          # was unpacked into, so a relative path would be written there.
          $report = Join-Path (Get-Location).Path 'selftest-windows.json'
          if (Test-Path $report) { Remove-Item $report }
          pwsh -File tools/run_windows_exe.ps1 `
            -Exe 'dist\HebrewNotesWorkbench\HebrewNotesWorkbench.exe' `
            -Report $report `
            -StdOut 'selftest-out.txt' `
            -StdErr 'selftest-err.txt'
          if (-not (Test-Path $report)) {
            Write-Output "::error title=Self-test::no report was written"
            throw 'The packaged executable did not write its report'
          }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          $data.results | ForEach-Object {
            $line = "$($_.name) ok=$($_.ok) $($_.detail)"
            if ($_.ok) { Write-Host $line } else { Write-Output "::error title=Self-test::$line" }
          }
          if (-not $data.ok) {
            throw 'The self-test reported failures'
          }
      - name: Build a console executable for diagnostics
        if: failure()
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console `
            --name HebrewNotesWorkbench-console app.py 2>&1 | Tee-Object -FilePath build-console.log
      - name: Show what the console build reports
        if: failure()
        shell: pwsh
        run: |
          pwsh -File tools/run_windows_exe.ps1 `
            -Exe 'dist\HebrewNotesWorkbench-console.exe' `
            -Report 'selftest-console.json' `
            -StdOut 'console-out.txt' `
            -StdErr 'console-err.txt'
      - name: Put the program into a folder for the user
        shell: pwsh
        run: |
          python tools/build_release.py --app dist/HebrewNotesWorkbench --download-licences
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName) $($_.Length)" } | Out-File -Encoding utf8 'dist-listing.txt'
          python tools/publish_diagnostics.py --branch=ci/diagnostics test-output.txt build-windows.log build-console.log selftest-windows.json selftest-out.txt selftest-out.txt.exit.txt selftest-err.txt selftest-console.json console-out.txt console-out.txt.exit.txt console-err.txt dist-listing.txt
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report-windows
          path: selftest-windows.json
          if-no-files-found: warn
      - name: Upload the Windows application
        uses: actions/upload-artifact@v4
        with:
          name: HebrewNotesWorkbench-Windows
          path: dist/HebrewNotesWorkbench
          if-no-files-found: error
      - name: Upload the archive for the user
        uses: actions/upload-artifact@v4
        with:
          name: HebrewNotesWorkbench-release
          path: release
          if-no-files-found: error

  ocr-engine:
    name: Recognition engine and accuracy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore the cache of the engine
        uses: actions/cache@v4
        with:
          path: |
            .cache/models
            .cache/pinkas
          key: engine-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: engine-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recognition engine
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            # torch and torchvision have to be a matching pair, and both
            # have to come from the same place.  kraken asks for
            # torch<=2.14, and the torchvision that belongs to torch
            # 2.14.1 asks for torch 2.14.1, so pip leaves the two
            # apart and the recognition dies with "operator
            # torchvision::nms does not exist".  The pair is pinned.
            python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" "torchvision==0.29.0"
            python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "kraken==7.1.1" "pillow==11.3.0"
          } 2>&1 | tee install-engine.log
      - name: Check that torch and torchvision belong together
        run: |
          python -c "import torch, torchvision, torchvision._C; print('torch', torch.__version__); print('torchvision', torchvision.__version__)" 2>&1 | tee check-engine.log
      - name: Download and check the recognition model
        run: |
          set -o pipefail
          python tools/download_model.py --model kraken-ppocrv6-small --target .cache/models 2>&1 | tee model-download.log
          if [ "$?" -ne 0 ]; then throw 'the model could not be downloaded'; fi
      - name: Measure the accuracy on real handwritten pages
        run: |
          set -o pipefail
          python tools/benchmark_ocr.py \
            --model .cache/models/small.safetensors \
            --download --cache .cache/pinkas --pages 10 --output ocr-accuracy.json 2>&1 | tee benchmark.log
          if [ "$?" -ne 0 ]; then throw 'the measurement failed'; fi
      - name: Look at the corpus
        if: always()
        continue-on-error: true
        run: |
          python tools/inspect_dataset.py --cache .cache/pinkas 2>&1 | tee corpus-structure.log || true
      - name: Write the results into the documentation
        if: always()
        continue-on-error: true
        env:
          # The name of the branch is handed over through the
          # environment, so that a branch name can never become part of
          # the commands of the build.
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if [ -f ocr-accuracy.json ]; then
            python tools/write_accuracy_results.py --report ocr-accuracy.json --document docs/OCR_ACCURACY.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            branch="$HEAD_BRANCH"
            git add docs/OCR_ACCURACY.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: the accuracy that was measured on the corpus"
              git push origin "HEAD:$branch"
            fi
          fi
      - name: Publish the accuracy report
        if: always()
        run: |
          if [ -f ocr-accuracy.json ]; then
            cat ocr-accuracy.json
            python tools/accuracy_notice.py --report ocr-accuracy.json
          fi
      - name: Upload the accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-accuracy-report
          path: ocr-accuracy.json
          if-no-files-found: warn
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        run: python tools/publish_diagnostics.py --branch=ci/diagnostics-engine install-engine.log model-download.log benchmark.log corpus-structure.log ocr-accuracy.json

  ocr-worker-windows:
    name: OCR worker (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recognition engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip 2>&1 | Out-File -Encoding utf8 install-engine.log
          # torch and torchvision must be a matching pair from the same
          # place, otherwise the recognition fails to start.  kraken asks
          # for torch<=2.14, and the torchvision that belongs to torch
          # 2.14.1 asks for torch 2.14.1, so pip leaves the two apart
          # and the worker dies with "operator torchvision::nms does not
          # exist".  The pair is pinned.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" "torchvision==0.29.0" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "kraken==7.1.1" "pillow==11.3.0" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
          python -m pip install "pyinstaller==6.16.0" 2>&1 | Out-File -Encoding utf8 -Append install-engine.log
      - name: Check that torch and torchvision belong together
        shell: pwsh
        run: |
          python -c "import torch, torchvision, torchvision._C; print('torch', torch.__version__); print('torchvision', torchvision.__version__)" 2>&1 | Out-File -Encoding utf8 check-engine.log
          if ($LASTEXITCODE -ne 0) { throw 'torch and torchvision do not belong together' }
      - name: Download and check the recognition model
        shell: pwsh
        run: |
          python tools/download_model.py --model kraken-ppocrv6-small --target .cache/models 2>&1 | Out-File -Encoding utf8 model-download.log
          if ($LASTEXITCODE -ne 0) { throw 'the model could not be downloaded' }
      - name: Build the OCR worker
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console `
            --collect-all kraken `
            --collect-all torchvision `
            --name ocr-worker ocr_worker/main.py 2>&1 | Tee-Object -FilePath build-worker.log
          if ($LASTEXITCODE -ne 0) { throw 'the worker could not be built' }
      - name: Recognise a page with the packaged worker
        shell: pwsh
        run: |
          $job = @{ document = (Resolve-Path 'samples\scan_page_1.png').Path; model_path = (Resolve-Path '.cache\models\small.safetensors').Path } | ConvertTo-Json
          $job | Set-Content -Encoding utf8 job.json
          $process = Start-Process -FilePath 'dist\ocr-worker\ocr-worker.exe' `
            -ArgumentList '--job','job.json','--result','result.json' `
            -Wait -PassThru -RedirectStandardOutput 'worker-out.txt' -RedirectStandardError 'worker-err.txt'
          Write-Host "exit code: $($process.ExitCode)"
          if (Test-Path 'worker-out.txt') { Get-Content 'worker-out.txt' | ForEach-Object { Write-Output "::warning title=Worker::$_" } }
          if (Test-Path 'worker-err.txt') { Get-Content 'worker-err.txt' | Select-Object -Last 20 | ForEach-Object { Write-Output "::warning title=Worker::$_" } }
          if (-not (Test-Path 'result.json')) { throw 'The worker did not write a result' }
          $result = Get-Content 'result.json' -Raw | ConvertFrom-Json
          if ($result.error) { Write-Output "::error title=Worker::$($result.error)"; throw 'The worker reported an error' }
          Write-Output "::warning title=Worker::recognised $($result.text.Length) characters in $($result.duration_seconds) seconds"
      - name: Upload the OCR worker
        uses: actions/upload-artifact@v4
        with:
          name: ocr-worker-Windows
          path: dist/ocr-worker
          if-no-files-found: error
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        run: python tools/publish_diagnostics.py --branch=ci/diagnostics-worker install-engine.log check-engine.log model-download.log build-worker.log worker-out.txt worker-err.txt result.json
