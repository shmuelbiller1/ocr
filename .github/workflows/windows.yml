name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Qt needs these system libraries to start its offscreen platform.
      # They come from the Ubuntu archive (main) and are only used by the
      # test job, never by the shipped application.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Unit tests failed::the test suite did not pass"
            tail -n 40 test-output.txt | while IFS= read -r line; do
              echo "::error title=Unit tests::${line}"
            done
            exit 1
          fi
      - name: Run the self-test without a display
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python app.py --selftest --selftest-report selftest-linux.json || {
            echo "::error title=Self-test failed::the self-test did not pass"
            cat selftest-linux.json | while IFS= read -r line; do
              echo "::error title=Self-test::${line}"
            done
            exit 1
          }
      - name: Show the self-test report
        if: always()
        run: cat selftest-linux.json
      - name: Publish the diagnostics
        if: failure()
        run: python tools/publish_diagnostics.py selftest-linux.json test-output.txt

  test-and-package:
    name: Windows executable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the test suite
        run: |
          python -m unittest discover -s tests -t . -v
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --add-data "samples;samples"
          --name HebrewNotesWorkbench app.py
      - name: Verify the executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\HebrewNotesWorkbench.exe')) {
            Write-Output '::error title=Packaging::the executable was not produced'
            throw 'Missing exe'
          }
          $size = (Get-Item 'dist\HebrewNotesWorkbench.exe').Length
          Write-Host "exe size: $size bytes"
      - name: Start the packaged executable (self-test)
        shell: pwsh
        run: |
          $report = 'selftest-windows.json'
          if (Test-Path $report) { Remove-Item $report }
          $process = Start-Process -FilePath 'dist\HebrewNotesWorkbench.exe' `
            -ArgumentList '--selftest','--selftest-report',$report `
            -PassThru -RedirectStandardOutput 'selftest-out.txt' -RedirectStandardError 'selftest-err.txt'
          # WaitForExit on the process object itself, so that the exit code
          # of the packaged executable can be read afterwards.
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Output '::error title=Self-test::the packaged executable did not finish within 180 seconds'
            throw 'The packaged executable hung'
          }
          $code = $process.ExitCode
          Write-Host "exit code: $code"
          "exit code: $code" | Out-File -Encoding utf8 'selftest-exit.txt'
          if (-not (Test-Path $report)) {
            Write-Output "::error title=Self-test::no report was written (exit code $code)"
            if (Test-Path 'selftest-err.txt') {
              Get-Content 'selftest-err.txt' | ForEach-Object { Write-Output "::error title=Self-test::$_" }
            }
            throw "The packaged executable failed its self-test (exit code $code)"
          }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          $data.results | ForEach-Object {
            $line = "$($_.name) ok=$($_.ok) $($_.detail)"
            if ($_.ok) { Write-Host $line } else { Write-Output "::error title=Self-test::$line" }
          }
          if (-not $data.ok) {
            throw 'The self-test reported failures'
          }
      - name: Build a console executable for diagnostics
        if: failure()
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name HebrewNotesWorkbench-console app.py
      - name: Show what the console build reports
        if: failure()
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist\HebrewNotesWorkbench-console.exe' `
            -ArgumentList '--selftest','--selftest-report','selftest-console.json' `
            -Wait -PassThru -RedirectStandardOutput 'console-out.txt' -RedirectStandardError 'console-err.txt'
          Write-Host "exit code: $($process.ExitCode)"
          "exit code: $($process.ExitCode)" | Out-File -Encoding utf8 'console-exit.txt'
          if (Test-Path 'console-out.txt') { Get-Content 'console-out.txt' | ForEach-Object { Write-Output "::error title=Console build::$_" } }
          if (Test-Path 'console-err.txt') { Get-Content 'console-err.txt' | ForEach-Object { Write-Output "::error title=Console build::$_" } }
      - name: Publish the diagnostics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/publish_diagnostics.py selftest-windows.json selftest-exit.txt selftest-out.txt selftest-err.txt selftest-console.json console-out.txt console-err.txt console-exit.txt
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report-windows
          path: selftest-windows.json
          if-no-files-found: warn
      - name: Upload the Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: HebrewNotesWorkbench-Windows
          path: dist/HebrewNotesWorkbench.exe
          if-no-files-found: error

  ocr-engine:
    name: OCR engine on real handwriting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recognition engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.9,<2.14"
          python -m pip install "kraken==7.1.1" "pillow==11.3.0"
          python -c "import torch, kraken; print('torch', torch.__version__); print('kraken', kraken.__version__)"
          python -c "import torch, kraken; print('::warning title=Engine versions::torch ' + torch.__version__ + ' / kraken ' + kraken.__version__)"
      - name: Download and check the recognition model
        run: |
          python tools/download_model.py --model kraken-ppocrv6-small --target .cache/models --print-digest > model-digest.txt
          cat model-digest.txt
          python - <<'PY'
          import json, pathlib
          text = pathlib.Path('model-digest.txt').read_text(encoding='utf-8')
          digest = [line for line in text.splitlines() if line.startswith('sha256:')][0].split(':', 1)[1].strip()
          print('::warning title=Model digest::sha256 ' + digest)
          PY
      - name: Measure the accuracy on real handwritten pages
        run: |
          python tools/benchmark_ocr.py \
            --model .cache/models/small.safetensors \
            --cache .cache/pinkas \
            --pages 3 \
            --output ocr-accuracy.json
      - name: Publish the accuracy report
        if: always()
        run: |
          if [ -f ocr-accuracy.json ]; then
            cat ocr-accuracy.json
            python - <<'PY'
          import json, pathlib
          path = pathlib.Path('ocr-accuracy.json')
          if path.exists():
              report = json.loads(path.read_text(encoding='utf-8'))
              summary = report['summary']
              for key, value in summary.items():
                  print(f'::warning title=Accuracy::{key} {value}')
              for item in report['results']:
                  print(f"::warning title=Accuracy::{item['page']} CER {item['cer']} WER {item['wer']} {item['seconds']}s")
          PY
          fi
      - name: Upload the accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-accuracy-report
          path: ocr-accuracy.json
          if-no-files-found: warn

  ocr-worker-windows:
    name: OCR worker (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recognition engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.9,<2.14"
          python -m pip install "kraken==7.1.1" "pillow==11.3.0"
      - name: Download the recognition model
        run: python tools/download_model.py --model kraken-ppocrv6-small --target .cache/models
      - name: Build the OCR worker
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name ocr-worker ocr_worker/main.py
      - name: Recognise a page with the packaged worker
        shell: pwsh
        run: |
          $job = @{ document = (Resolve-Path 'samples\scan_page_1.png').Path; model_path = (Resolve-Path '.cache\models\small.safetensors').Path } | ConvertTo-Json
          $job | Set-Content -Encoding utf8 job.json
          $process = Start-Process -FilePath 'dist\ocr-worker.exe' `
            -ArgumentList '--job','job.json','--result','result.json' `
            -Wait -PassThru -RedirectStandardOutput 'worker-out.txt' -RedirectStandardError 'worker-err.txt'
          Write-Host "exit code: $($process.ExitCode)"
          if (Test-Path 'worker-out.txt') { Get-Content 'worker-out.txt' | ForEach-Object { Write-Output "::warning title=Worker::$_" } }
          if (Test-Path 'worker-err.txt') { Get-Content 'worker-err.txt' | Select-Object -Last 20 | ForEach-Object { Write-Output "::warning title=Worker::$_" } }
          if (-not (Test-Path 'result.json')) { throw 'The worker did not write a result' }
          $result = Get-Content 'result.json' -Raw | ConvertFrom-Json
          if ($result.error) { Write-Output "::error title=Worker::$($result.error)"; throw 'The worker reported an error' }
          Write-Output "::warning title=Worker::recognised $($result.text.Length) characters in $($result.duration_seconds) seconds"
      - name: Upload the OCR worker
        uses: actions/upload-artifact@v4
        with:
          name: ocr-worker-Windows
          path: dist/ocr-worker.exe
          if-no-files-found: error
