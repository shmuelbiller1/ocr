name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Run the self-test without a display
        env:
          QT_QPA_PLATFORM: offscreen
        run: python app.py --selftest --selftest-report selftest-linux.json
      - name: Show the self-test report
        if: always()
        run: cat selftest-linux.json

  test-and-package:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name HebrewNotesWorkbench app.py
      - name: Verify the executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\HebrewNotesWorkbench.exe')) { throw 'Missing exe' }
          $size = (Get-Item 'dist\HebrewNotesWorkbench.exe').Length
          Write-Host "exe size: $size bytes"
      - name: Start the packaged executable (self-test)
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist\HebrewNotesWorkbench.exe' `
            -ArgumentList '--selftest','--selftest-report','selftest-windows.json' `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "The packaged executable failed its self-test (exit code $($process.ExitCode))"
          }
          if (-not (Test-Path 'selftest-windows.json')) { throw 'No self-test report was written' }
          $report = Get-Content 'selftest-windows.json' -Raw | ConvertFrom-Json
          $report.results | Format-Table -AutoSize | Out-String | Write-Host
          if (-not $report.ok) { throw 'The self-test reported failures' }
      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report-windows
          path: selftest-windows.json
          if-no-files-found: warn
      - name: Upload the Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: HebrewNotesWorkbench-Windows
          path: dist/HebrewNotesWorkbench.exe
          if-no-files-found: error
